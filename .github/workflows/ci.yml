# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The tests in three parts per Go release, side by side (design D291):
  # the core module with the repository-wide checks and the allocation
  # budgets; the cli module, whose tests make, build and test whole
  # projects; and every other module (drivers, admin, plugins, examples).
  test-part:
    name: test (${{ matrix.go.name }}, ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        go:
          - name: minimum Go (go.mod)
            file: go.mod
          - name: latest Go
            version: stable
        part: [core, cli, modules]
    # Servers for the driver modules' conformance tests. PostgreSQL with
    # pgvector, so vector and hybrid search are tested, not only refused.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: anetos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: anetos_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -psecret" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANETOS_TEST_POSTGRES_URL: postgres://postgres:secret@127.0.0.1:5432/anetos_test
      ANETOS_TEST_MYSQL_URL: root:secret@tcp(127.0.0.1:3306)/anetos_test
      ANETOS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go.version }}
          go-version-file: ${{ matrix.go.file }}
      # The repository-wide checks, before MODULES narrows make's targets.
      - if: matrix.part == 'core'
        run: make fmt-check spdx docs-check api-docs gen-check
      # The part's modules, as the Makefile's MODULES lists them.
      - name: modules of the part
        run: |
          case "$PART" in
            core) modules=. ;;
            cli) modules=./cli ;;
            modules) modules=$(find . -name go.mod -not -path './.git/*' | sed 's|/go.mod$||' | grep -vx -e . -e ./cli | sort | tr '\n' ' ') ;;
          esac
          echo "MODULES=$modules" >>"$GITHUB_ENV"
      # Latest Go's cli part also downloads Tailwind CSS's standalone CLI
      # (checking its pinned digest) and compiles the tailwind kit with it
      # (design D301); the other parts don't need it.
      - run: make vet test
        env:
          ANETOS_TEST_TAILWIND: ${{ matrix.part == 'cli' && matrix.go.name == 'latest Go' && '1' || '' }}
      # The examples that run on every database, on PostgreSQL and MySQL
      # too (make test runs them on SQLite), each in a database of its own.
      - name: examples on PostgreSQL and MySQL
        if: matrix.part == 'modules'
        run: |
          for e in tracker assistant; do
            PGPASSWORD=secret psql -h 127.0.0.1 -U postgres -qc "CREATE DATABASE ${e}_test"
            (cd examples/$e && DB_CONNECTION=postgres DB_URL="postgres://postgres:secret@127.0.0.1:5432/${e}_test?sslmode=disable" go test -count=1 ./...)
          done
          # MySQL 8 can't search vectors: the assistant refuses it.
          mysql -h 127.0.0.1 -u root -psecret -e "CREATE DATABASE tracker_test"
          (cd examples/tracker && DB_CONNECTION=mysql DB_URL="root:secret@tcp(127.0.0.1:3306)/tracker_test?parseTime=true" go test -count=1 ./...)
      - if: matrix.part == 'core'
        run: make bench-check

  # The checks the main branch's ruleset requires, one per Go release,
  # under their names from before the split: green when every part of
  # the tests is (a failing part fails both).
  test:
    name: test (${{ matrix.name }})
    if: always()
    needs: test-part
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        name: [minimum Go (go.mod), latest Go]
    steps:
      - env:
          RESULT: ${{ needs.test-part.result }}
        run: |
          echo "The tests' parts: $RESULT"
          test "$RESULT" = success

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          install-only: true
      - run: make lint

  # Both supported Go releases: a standard library advisory may affect
  # only the older one. Each at its latest patch release: the standard
  # library's fixes come with the Go a project builds with, not with
  # go.mod's minimum (go 1.26.0 there would report every advisory fixed
  # since, which no user who updates Go is exposed to).
  vuln:
    name: vuln (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum Go (go.mod)
            minimum: true
          - name: latest Go
            go-version: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go.mod's "go 1.26.0" becomes "1.26.x": that release's latest patch,
      # looked up even when the runner has an older one installed
      # (check-latest), so a new security release is used the day it's out.
      - id: minimum
        if: matrix.minimum
        run: echo "go-version=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod).x" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version || steps.minimum.outputs.go-version }}
          check-latest: true
      - run: go version
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: make vuln

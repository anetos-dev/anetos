# SPDX-License-Identifier: Apache-2.0
name: Documentation
description: A page on docs.anetos.dev is wrong, unclear or missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: The page
      description: Its URL, or the file in docs/site.
      placeholder: https://docs.anetos.dev/guides/queues/
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing
      description: Quote the sentence or the code, and say what you expected to read.
    validations:
      required: true

# Weekly updates of the CI's actions (pinned by commit) and of the
# published modules' dependencies. Security updates come as soon as an
# advisory is out, whatever the schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /
      - /admin
      - /cli
      - /drivers/*
      - /plugins/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]

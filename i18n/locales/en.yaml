# The framework's English messages. An app overrides any of them by
# defining the key in its own catalog (locales/en/*.yaml), and translates
# them by defining them in another locale's.

validation:
  required: "The {label} field is required."
  required_if: "The {label} field is required when {0} is {1}."
  required_unless: "The {label} field is required unless {0} is {1}."
  required_with: "The {label} field is required when {list} is present."
  required_without: "The {label} field is required when {list} is not present."
  accepted: "The {label} field must be accepted."
  min:
    string: "The {label} field must be at least {0} characters."
    numeric: "The {label} field must be at least {0}."
    array: "The {label} field must have at least {0} items."
  max:
    string: "The {label} field must not be greater than {0} characters."
    numeric: "The {label} field must not be greater than {0}."
    array: "The {label} field must not have more than {0} items."
  size:
    string: "The {label} field must be {0} characters."
    numeric: "The {label} field must be {0}."
    array: "The {label} field must contain {0} items."
  between:
    string: "The {label} field must be between {0} and {1} characters."
    numeric: "The {label} field must be between {0} and {1}."
    array: "The {label} field must have between {0} and {1} items."
  email: "The {label} field must be a valid email address."
  url: "The {label} field must be a valid URL."
  uuid: "The {label} field must be a valid UUID."
  alpha: "The {label} field must only contain letters."
  alpha_num: "The {label} field must only contain letters and numbers."
  alpha_dash: "The {label} field must only contain letters, numbers, dashes, and underscores."
  ascii: "The {label} field must only contain ASCII characters."
  numeric: "The {label} field must be a number."
  integer: "The {label} field must be an integer."
  lowercase: "The {label} field must be lowercase."
  uppercase: "The {label} field must be uppercase."
  starts_with: "The {label} field must start with one of the following: {list}."
  ends_with: "The {label} field must end with one of the following: {list}."
  ip: "The {label} field must be a valid IP address."
  json: "The {label} field must be a valid JSON string."
  date: "The {label} field must be a valid date (YYYY-MM-DD)."
  datetime: "The {label} field must be a valid date and time (RFC 3339)."
  in: "The selected {label} is invalid."
  not_in: "The selected {label} is invalid."
  distinct: "The {label} field has a duplicate value."
  same: "The {label} field must match {0}."
  different: "The {label} field and {0} must be different."
  confirmed: "The {label} field confirmation does not match."
  after: "The {label} field must be a date after {0}."
  after_or_equal: "The {label} field must be a date after or equal to {0}."
  before: "The {label} field must be a date before {0}."
  before_or_equal: "The {label} field must be a date before or equal to {0}."
  max_size: "The {label} field must not be greater than {0}."
  min_size: "The {label} field must be at least {0}."
  mimetypes: "The {label} field must be a file of type: {list}."
  extensions: "The {label} field must have one of the following extensions: {list}."
  image: "The {label} field must be an image."
  custom: "The {label} field is invalid."
  # Labels of fields, by key: attributes.email: "email address".
  # Words used as rule arguments, by value.
  values:
    now: "now"

# Error pages and problem responses.
http:
  # Titles by status code; codes without one use Go's English status text.
  status:
    400: "Bad Request"
    401: "Unauthorized"
    403: "Forbidden"
    404: "Not Found"
    405: "Method Not Allowed"
    406: "Not Acceptable"
    408: "Request Timeout"
    409: "Conflict"
    410: "Gone"
    413: "Request Entity Too Large"
    415: "Unsupported Media Type"
    422: "Unprocessable Entity"
    429: "Too Many Requests"
    500: "Internal Server Error"
    502: "Bad Gateway"
    503: "Service Unavailable"
    504: "Gateway Timeout"
  invalid_data: "The given data was invalid."
  invalid_values: "The request has invalid values."
  csrf: "The page has expired. Reload it and try again."
  cross_origin: "Cross-origin request rejected."
  unsupported_locale: "That language isn't available."
  problems: "Problems"
  request_id: "Request ID: {id}"

# Values a form or query field couldn't be read as.
binding:
  bool: "must be true or false"
  integer: "must be an integer"
  number: "must be a number"
  date: "must be a date (YYYY-MM-DD)"
  time: "must be a date and time"
  duration: "must be a duration (30s, 5m, 1h)"
  string: "must be text"
  list: "must be a list"
  object: "must be an object"
  value: "is not a valid value"

auth:
  social_failed: "We couldn't sign you in. Please try again."
  social_account: "We couldn't sign you in with that account. Please try again."
  social_incomplete: "The sign-in didn't complete. Please try again."
  social_canceled: "The sign-in was canceled."
  social_error: "The sign-in service reported an error. Please try again."

ai:
  usage_limit: "You've reached your AI usage limit. Try again in {wait}."

# Formats (CLDR): names and patterns for i18n.Date, Time, DateTime,
# Format and Currency. A language's catalog brings its own.
format:
  language: "English" # the language's own name
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
  days: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
  days_short: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
  periods: [AM, PM]
  date:
    short: "M/d/yy"
    medium: "MMM d, y"
    long: "MMMM d, y"
    full: "EEEE, MMMM d, y"
  time:
    short: "h:mm a"
    medium: "h:mm:ss a"
    long: "h:mm:ss a z"
    full: "h:mm:ss a zzzz"
  datetime:
    short: "{date}, {time}"
    medium: "{date}, {time}"
    long: "{date} at {time}"
    full: "{date} at {time}"
  currency: "{symbol}{amount}"

# Relative times (i18n.Ago) and durations (i18n.Duration).
relative:
  now: "just now"
  past: "{time} ago"
  future: "in {time}"
  units:
    second: {one: "{count} second", other: "{count} seconds"}
    minute: {one: "{count} minute", other: "{count} minutes"}
    hour: {one: "{count} hour", other: "{count} hours"}
    day: {one: "{count} day", other: "{count} days"}
    month: {one: "{count} month", other: "{count} months"}
    year: {one: "{count} year", other: "{count} years"}
